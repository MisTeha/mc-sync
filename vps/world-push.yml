# Replace a server's world with the one push-world.ps1 uploaded.
#
#   ansible-playbook world-push.yml -e server=survival
#
# push-world.ps1 first syncs your local world into <server>/.sync-world with rclone, which only
# sends the files that changed since the last push or pull. This playbook then stops the server
# if needed, copies that upload into a staging folder and sorts out its player data (see
# scripts/players.py), moves the old world into the backups, puts the new one in place, and
# starts the server again only if it was running before.
#
# .sync-world itself is left exactly as uploaded: it's what the next sync compares against.

- name: Push a world to a Minecraft server
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ mc_root }}/{{ server }}"
    world_dir: "{{ project_dir }}/{{ world_subdir }}"
    sync_dir: "{{ project_dir }}/{{ sync_subdir }}"
    incoming_dir: "{{ project_dir }}/.incoming-world"

  tasks:
    - name: Load server info
      ansible.builtin.import_tasks: tasks/load-server.yml

    - name: Install the player data tools
      ansible.builtin.import_tasks: tasks/player-tools.yml

    - name: Look for the uploaded world
      ansible.builtin.stat:
        path: "{{ sync_dir }}/level.dat"
      register: upload_stat

    - name: Fail if nothing was uploaded
      ansible.builtin.assert:
        that: upload_stat.stat.exists
        fail_msg: "No uploaded world in {{ sync_dir }}. push-world.ps1 uploads it before running this."

    - name: Stop the server
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: absent
      when: was_running | bool

    - name: Clear the staging folder
      ansible.builtin.file:
        path: "{{ incoming_dir }}"
        state: absent

    - name: Copy the upload into the staging folder
      ansible.builtin.command: cp -a "{{ sync_dir }}" "{{ incoming_dir }}"
      changed_when: true

    - name: Sort out player data (your inventory, and keep everyone else's)
      ansible.builtin.command: >-
        "{{ tools_venv }}/bin/python" "{{ playbook_dir }}/scripts/players.py"
        push "{{ incoming_dir }}" "{{ world_dir }}"
      register: players_report
      changed_when: true

    - name: Show what happened to each player
      ansible.builtin.debug:
        var: players_report.stdout_lines

    - name: Move the current world into the backups
      ansible.builtin.import_tasks: tasks/backup-world.yml

    - name: Make sure the folder the world goes in exists (e.g. if data/ was deleted)
      ansible.builtin.file:
        path: "{{ world_dir | dirname }}"
        state: directory

    - name: Move the new world into place
      ansible.builtin.command: mv "{{ incoming_dir }}" "{{ world_dir }}"
      changed_when: true

    - name: Start the server again
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
      when: was_running | bool
